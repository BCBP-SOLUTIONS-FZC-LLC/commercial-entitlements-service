name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/commercial-entitlements
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
  GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.CI_REPO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Build all binaries
        run: make build

  build-image:
    name: build image
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags:   ${{ steps.meta.outputs.tags }}
      image-ref:    ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
      can-push:     ${{ steps.can-push.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Can push?
        id: can-push
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.can-push.outputs.value == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build
        id: prep
        env:
          REGISTRY_REF: ${{ env.IMAGE_NAME }}:buildcache
          CAN_PUSH: ${{ steps.can-push.outputs.value }}
        run: bash .github/scripts/docker-build-prep.sh

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.can-push.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.prep.outputs.from }}
          cache-to: ${{ steps.prep.outputs.to }}
          secrets: |
            go_private_token=${{ secrets.CI_REPO_READ_TOKEN }}
          provenance: true
          sbom: true

      - name: Log image digest
        if: steps.can-push.outputs.value == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh

  trivy-scan:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: build-image
    if: needs.build-image.outputs.can-push == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-image.outputs.image-ref }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          trivyignores: .trivyignore

  smoke-test:
    name: smoke test
    runs-on: ubuntu-latest
    needs: build-image
    if: needs.build-image.outputs.can-push == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commercial_entitlements
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d commercial_entitlements"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run smoke tests
        env:
          IMAGE_TAG: ${{ needs.build-image.outputs.image-ref }}
          DATABASE_URL: postgres://app:app@localhost:5432/commercial_entitlements?sslmode=disable
          VALKEY_URL: localhost:6379
        run: bash .github/scripts/smoke-tests.sh

  schema-stage:
    name: stage event schemas
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SCHEMA_REGISTRY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Stage produced event schemas
        env:
          GLUE_REGISTRY_ENTITLEMENTS_NAME: ${{ vars.GLUE_REGISTRY_ENTITLEMENTS_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: bash .github/scripts/stage-produced-event-schemas.sh
