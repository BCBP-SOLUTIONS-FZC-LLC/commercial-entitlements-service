# Reusable workflow — quality gate.
# fmt · tidy · vet · lint (golangci-lint) · vuln-check · Helm (lint + template + kubeconform).
# Called by ci.yml and release.yml. Must pass before push/release; does NOT
# gate coverage, trivy, or smoke (those only need validate-test.yml).
# Helm validation runs inline here (not as a separate job) to keep the parallel
# job count flat.
name: Validate / Quality

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      - name: Verify modules
        run: go mod verify

      # Workflow files must use literal operators, not HTML entity encodings.
      - name: Reject HTML-escaped operators in workflow files
        run: |
          if grep -REn '&(gt|lt|amp)' .github/workflows/ .github/scripts/; then
            echo "::error::Workflow or script files contain HTML entities. Use literal operators instead."
            exit 1
          fi

      # RLS-6 CI gate: reject any non-LOCAL SET app.tenant_id in Go/SQL source.
      # The only legitimate way to bind the GUC is via pgcommon.WithGUCSet /
      # GUCSetFromContext, which emits SET LOCAL inside a transaction. A
      # session-scoped SET would persist across pooled backends and leak across
      # tenants under PgBouncer — the exact breach RLS-6 exists to prevent.
      - name: Reject non-LOCAL SET app.tenant_id (RLS-6)
        run: |
          hits=$(grep -REn '\bSET[[:space:]]+("?app\.tenant_id"?)[[:space:]]*=' \
                   --include='*.go' --include='*.sql' \
                   cmd/ internal/ | grep -v 'SET LOCAL' | grep -v 'set_config' || true)
          if [ -n "$hits" ]; then
            echo "::error::Non-LOCAL SET app.tenant_id detected (RLS-6). Use pgcommon.WithGUCSet + RunInTx which emits SET LOCAL inside a tx."
            echo "$hits"
            exit 1
          fi
          echo "RLS-6 non-LOCAL SET check passed."

      # Enterprise Platform Observability Standard: every registered Prometheus
      # collector must follow the commercial_entitlements_*/platform_* naming
      # hierarchy, the _total/_seconds suffix rules.
      - name: Metric naming convention check
        run: bash .github/scripts/check-metric-naming.sh

      # Validates the Prometheus metrics registry for commercial-entitlements:
      # prefix conformance, duplicate names, counter/histogram suffix rules.
      - name: Metrics registry ratification check
        run: bash .github/scripts/metrics-registry-lint.sh

      # platform-gincommon's own metricslint: registry compliance and label
      # vocabulary on a real scrape, plus legacy/unregistered names in alert
      # rules, dashboards and runbooks.
      - name: Observability standard lint (metricslint)
        run: bash .github/scripts/metricslint.sh

      # Every SNS publish / SQS consume must go through platform-events
      # (events.NewSNSPublisher / events.NewSQSConsumerWithClient), never a
      # raw aws-sdk-go-v2 SNS/SQS call or a hand-built events.Envelope{}.
      - name: Events bypass check
        run: bash .github/scripts/check-forbidden-events-bypass.sh

      # Structural isolation of the platform-events seams: outbox writes only
      # in eventbus/publisher.go; inbox.NewStore and store.Process only in
      # postgres/idempotency_repository.go; events.InitMetrics in composition roots.
      - name: Events platform isolation check
        run: bash .github/scripts/check-events-platform.sh

      # Every outbox_events write/read/prune must go through platform-events
      # (outbox.Enqueue / outbox.Runner.PrunePublished), never hand-rolled SQL.
      - name: Outbox access check
        run: bash .github/scripts/check-outbox-access.sh

      # All DB connections/configuration/operations must pass through
      # platform-pgcommon (pgcommon.NewPool, RunInTx*, ConfigFromEnv).
      - name: Database access check
        run: bash .github/scripts/check-database-access.sh

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}" | while IFS= read -r f; do
              echo "::error file=${f},title=Format check::Not formatted — run 'make fmt'"
            done
            exit 1
          fi

      - name: Tidy check
        run: |
          make tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error file=go.mod,title=Module drift::go.mod or go.sum is stale — run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: |
          if ! make vuln-check; then
            echo "::error file=go.mod,title=Vulnerability found::govulncheck detected vulnerabilities — run 'make vuln-check' locally to view details."
            exit 1
          fi

      # Enforce digest-pinned FROM lines in the Dockerfile. Floating tags (e.g.
      # golang:1.26-alpine without @sha256:...) can be silently overwritten by
      # upstream maintainers, breaking supply-chain guarantees.
      - name: Dockerfile base image digest check
        run: |
          if grep -E '^FROM [^ @]+:[^ @]+( AS .+)?$' Dockerfile; then
            echo "::error file=Dockerfile,title=Unpinned base image::Dockerfile FROM lines must use digest-pinned references (e.g. golang:1.26-alpine@sha256:...). Run 'make pin-base-images' to update."
            exit 1
          fi
          echo "Dockerfile base images are digest-pinned."

      # Helm lint (--strict) + helm template × 3 values combos + kubeconform.
      # Runs inline here (same job as the Go quality checks) so there is no
      # extra parallel job slot.
      #
      # Values combinations exercised:
      #   base only | base+values-dev.yaml | base+values-prod.yaml
      #
      # kubeconform validates standard K8s resources (K8s 1.31.0 schemas).
      # CRD kinds (ServiceMonitor, PrometheusRule, HTTPRoute, SecurityPolicy,
      # AuthorizationPolicy) are skipped via -ignore-missing-schemas.
      - name: Cache helm + kubeconform binaries
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/bin
          key: helm-check-tools-${{ runner.os }}-helm3.16.3-kubeconform0.6.7

      - name: Helm lint + template + kubeconform
        run: bash .github/scripts/helm-check.sh
