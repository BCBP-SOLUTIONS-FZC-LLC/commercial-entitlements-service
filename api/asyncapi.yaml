asyncapi: "3.0.0"

info:
  title: Commercial Entitlements Service — Event Contracts
  version: "1.6.0"
  description: |
    Publishes `tenant_entitlements_changed` whenever a tenant's effective
    entitlement set is recomputed.
    Consumes Billing's `TenantQuotaAddOnChanged` from `billing-entitlements-q`:
    `reason: "purchase"` creates a new quota addon pack (expiry = purchased_at + 12 months,
    idempotent on billing_ref); `reason: "refund"` reduces unused tokens on the referenced
    pack (C-5 / BL-OQ-23, E-1 / BL-OQ-4).
    Also consumes Billing's `TenantPlanChanged`, `TenantSubscriptionCancelled` and
    `TenantReactivated` from `billing-entitlements-q`; each triggers a Recompute
    that re-reads plan and status from Core (I-17). Every message on
    `billing-entitlements-q` may be Glue-framed (18-byte header + `dataschema`);
    the consumer strips the header before validating against the schemas below.
    Consumes iam-realm-provisioner's tenant lifecycle events from `tenant-entitlements-q`:
    TenantIdentityProvisioned and TenantSubscriptionUpdated trigger Recompute; TenantSuspended,
    TenantReactivated (source=operator), and TrialExpired trigger Recompute and update
    entitlement state; TenantMembershipsPurged, TenantConverted, TenantOffboarded trigger
    handleOffboard (TenantMembershipsPurged first forfeits every active add-on pack, E-9).
    Consumes TenantMembershipsPurged from `membership-entitlements-q` (forfeits every
    active add-on pack, E-9, then recomputes) and O&M's `TenantStateChanged`, and
    recomputes when cause is TrialReactivated (conversion revert), when cause is
    one of Billing's subscription events (TenantPlanChanged,
    TenantSubscriptionCancelled, TenantReactivated, TenantPaymentPastDue), or
    when plan or status changed. Published by iam-org-membership via
    transactional outbox — receipt guarantees I-17 reflects the new state
    (E-3 read-race fix; B-3 Billing/Core ordering).
  contact:
    name: BCBP Solutions Platform Team
    email: platform@bcbpsolutions.com

servers:
  production:
    host: "sns.ap-south-1.amazonaws.com"
    protocol: "sns"
    description: "AWS SNS entitlements topic"

channels:
  tenantEntitlements:
    address: "arn:aws:sns:{region}:{account}:iam-entitlements-events"
    description: "SNS topic for all entitlement change events."
    bindings:
      sns:
        policy:
          statements: []

  billingEntitlementsQueue:
    address: "arn:aws:sqs:{region}:{account}:billing-entitlements-q"
    description: "SQS queue receiving Billing events that drive entitlement changes."
    bindings:
      sqs:
        queue:
          name: billing-entitlements-q

  tenantEntitlementsQueue:
    address: "arn:aws:sqs:{region}:{account}:tenant-entitlements-q"
    description: "SQS queue receiving iam-realm-provisioner tenant lifecycle events."
    bindings:
      sqs:
        queue:
          name: tenant-entitlements-q

  membershipEntitlementsQueue:
    address: "arn:aws:sqs:{region}:{account}:membership-entitlements-q"
    description: "SQS queue receiving IAM Org & Membership lifecycle events."
    bindings:
      sqs:
        queue:
          name: membership-entitlements-q

operations:
  publishTenantEntitlementsChanged:
    action: send
    channel:
      $ref: "#/channels/tenantEntitlements"
    summary: "Publish when a tenant's effective entitlement set changes."
    description: |
      Emitted after every successful Recompute: plan-based, trial, override,
      and addon-balance changes all produce this event.
    messages:
      - $ref: "#/components/messages/TenantEntitlementsChanged"

  consumeTenantLifecycleEvents:
    action: receive
    channel:
      $ref: "#/channels/tenantEntitlementsQueue"
    summary: "Consume iam-realm-provisioner tenant lifecycle events."
    description: |
      iam-realm-provisioner publishes tenant lifecycle events on iam-tenant-events →
      tenant-entitlements-q (CD-6, CD-49). All events carry a minimal payload {tenant_id}.
      TenantIdentityProvisioned and TenantSubscriptionUpdated → Recompute (initial snapshot
      and forward-compat plan-change signal). TenantSuspended, TenantReactivated (source=operator),
      and TrialExpired → Recompute; entitlement state updated from I-17 on receipt.
      TenantMembershipsPurged, TenantConverted and TenantOffboarded → handleOffboard: delete
      tenant_trial_assignments and trial_entitlement_overrides in one tx, then Recompute
      (ENT-INV-7). TenantMembershipsPurged first forfeits every active add-on pack (status
      forfeited, AL-5 billing.token_addon.revoked, E-9); packs survive TenantConverted.
      All types are deduplicated via processed_events (IDEMP-1..4).
    messages:
      - $ref: "#/components/messages/InboundTenantLifecycle"

  consumeTenantStateChanged:
    action: receive
    channel:
      $ref: "#/channels/membershipEntitlementsQueue"
    summary: "Consume O&M TenantStateChanged to recompute after Core applies a plan or status change."
    description: |
      iam-org-membership publishes TenantStateChanged via transactional outbox after
      every tenant plan or status transition; cause is the source event type.
      A recompute runs when cause is TrialReactivated, when cause is one of
      Billing's subscription events (TenantPlanChanged, TenantSubscriptionCancelled,
      TenantReactivated, TenantPaymentPastDue — Billing publishes these to Core and
      to billing-entitlements-q unordered, so this relay is the recompute that
      settles on Core's committed state, B-3), or when plan or status changed.
      Anything else is acknowledged. Because the event is published after O&M's DB
      commit, a subsequent I-17 call always reflects the new state (E-3).
    messages:
      - $ref: "#/components/messages/InboundTenantStateChanged"

  consumeTenantQuotaAddOnChanged:
    action: receive
    channel:
      $ref: "#/channels/billingEntitlementsQueue"
    summary: "Consume Billing's add-on purchase and refund events."
    description: |
      Billing publishes TenantQuotaAddOnChanged on billing.events for every
      confirmed purchase (reason: purchase) and succeeded refund (reason: refund).
      On reason: purchase — creates a new addon pack; delta > 0; expiry =
      purchased_at + 12 months; idempotent on billing_ref (E-1 / BL-OQ-4).
      On reason: refund — reduces unused tokens on the referenced pack (purchase_ref),
      never below zero and never consuming already-drawn tokens; idempotent on
      billing_ref (C-5 / BL-OQ-23).
    messages:
      - $ref: "#/components/messages/InboundTenantQuotaAddOnChanged"

  consumeBillingSubscriptionEvents:
    action: receive
    channel:
      $ref: "#/channels/billingEntitlementsQueue"
    summary: "Consume Billing's subscription plan, cancellation and reactivation events."
    description: |
      Billing publishes TenantPlanChanged, TenantSubscriptionCancelled and
      TenantReactivated on billing.events. Each triggers a Recompute
      (cause billing_event) that re-reads plan and status from Core (I-17); only
      tenant_id is read from the payload. Core applies the same events on its own
      queue, unordered with this one, so Core's TenantStateChanged relay
      (consumeTenantStateChanged) performs the settling recompute (B-3).
      A payload that fails its schema is dead-lettered on first delivery; one that
      does not decode is retried and dead-lettered (B-4, B-5).
      The SNS subscription filter for billing-entitlements-q must admit all four
      types: EventType IN [TenantQuotaAddOnChanged, TenantPlanChanged,
      TenantSubscriptionCancelled, TenantReactivated] (B-6).
    messages:
      - $ref: "#/components/messages/InboundBillingTenantPlanChanged"
      - $ref: "#/components/messages/InboundBillingTenantSubscriptionCancelled"
      - $ref: "#/components/messages/InboundBillingTenantReactivated"

components:
  messages:
    TenantEntitlementsChanged:
      name: TenantEntitlementsChanged
      title: Tenant Entitlements Changed
      summary: "A tenant's effective entitlement set has been recomputed."
      contentType: application/json
      payload:
        $ref: "#/components/schemas/TenantEntitlementsChangedPayload"

    InboundTenantStateChanged:
      name: TenantStateChanged
      title: Tenant State Changed (inbound from IAM Org & Membership)
      summary: "O&M's post-commit notification that a tenant's subscription state changed."
      contentType: application/json
      x-lifecycle:
        status: active
      payload:
        $ref: "#/components/schemas/InboundTenantStateChangedPayload"

    InboundTenantLifecycle:
      name: TenantLifecycleEvent
      title: Tenant Lifecycle Event (inbound from iam-realm-provisioner)
      summary: "iam-realm-provisioner lifecycle events on tenant-entitlements-q."
      contentType: application/json
      x-lifecycle:
        status: active
      payload:
        $ref: "#/components/schemas/InboundTenantLifecyclePayload"

    InboundTenantQuotaAddOnChanged:
      name: TenantQuotaAddOnChanged
      title: Tenant Quota Add-On Changed (inbound from Billing)
      summary: "Billing's event for purchase and refund of quota add-on packs."
      contentType: application/json
      x-lifecycle:
        status: active
      payload:
        $ref: "#/components/schemas/InboundTenantQuotaAddOnChangedPayload"

    InboundBillingTenantPlanChanged:
      name: TenantPlanChanged
      title: Tenant Plan Changed (inbound from Billing)
      summary: "Billing changed a tenant's subscription plan."
      contentType: application/json
      x-lifecycle:
        status: active
      payload:
        $ref: "#/components/schemas/InboundBillingTenantPlanChangedPayload"

    InboundBillingTenantSubscriptionCancelled:
      name: TenantSubscriptionCancelled
      title: Tenant Subscription Cancelled (inbound from Billing)
      summary: "Billing cancelled a tenant's subscription."
      contentType: application/json
      x-lifecycle:
        status: active
      payload:
        $ref: "#/components/schemas/InboundBillingTenantSubscriptionCancelledPayload"

    InboundBillingTenantReactivated:
      name: TenantReactivated
      title: Tenant Reactivated (inbound from Billing)
      summary: "Billing reactivated a past-due or cancelled subscription (source: billing)."
      contentType: application/json
      x-lifecycle:
        status: active
      payload:
        $ref: "#/components/schemas/InboundBillingTenantReactivatedPayload"

  schemas:
    TenantEntitlementsChangedPayload:
      type: object
      required:
        - tenant_id
        - version
        - cause
        - computed_at
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "UUID of the tenant whose entitlements were recomputed."
        version:
          type: integer
          minimum: 1
          description: "Monotonically increasing snapshot version number."
        cause:
          type: string
          enum:
            - plan_change
            - override_change
            - addon_change
            - trial_change
            - catalog_refresh
            - billing_event
            - manual_recompute
            - tenant_lifecycle
            - shortfall_resolution
          description: "What triggered this recomputation."
        changed_keys:
          type: array
          items:
            type: string
          description: "Limit keys whose values changed in this version."
        previous_version:
          type: integer
          minimum: 0
          description: "The snapshot version before this recomputation."
        computed_at:
          type: string
          format: date-time
          description: "Wall-clock time the recomputation completed (UTC)."
      additionalProperties: true

    InboundTenantLifecyclePayload:
      type: object
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "UUID of the tenant affected by this lifecycle event."
      additionalProperties: true
      description: |
        Minimal common payload for all tenant lifecycle events from iam-realm-provisioner.
        Each event type carries only tenant_id; additional fields vary by event and are
        ignored by this service (ENT-INV-1: the consumer always re-reads I-17 on receipt).

    InboundTenantQuotaAddOnChangedPayload:
      type: object
      required:
        - tenant_id
        - resource
        - delta
        - reason
        - billing_ref
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "The tenant whose add-on was purchased or refunded."
        resource:
          type: string
          description: "Resource type (e.g. llm_tokens)."
        delta:
          type: integer
          not:
            const: 0
          description: "Token delta: positive for purchase, negative for refund."
        reason:
          type: string
          enum:
            - purchase
            - refund
          description: "Whether this is a purchase or a refund."
        billing_ref:
          type: string
          description: "Billing-side idempotency key (purchase or refund ID)."
        purchase_ref:
          type: string
          format: uuid
          description: "UUID of the original add-on grant; present on refund events only."
        purchased_at:
          type: string
          format: date-time
          description: "Payment-confirmation instant; present on purchase events. Expiry = purchased_at + 12 months (E-1 / BL-OQ-4)."
      additionalProperties: true

    InboundTenantStateChangedPayload:
      type: object
      required:
        - tenant_id
        - status
        - previous_status
        - cause
        - changed_at
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "UUID of the tenant whose state changed."
        status:
          type: string
          description: "New subscription status after the change."
        previous_status:
          type: string
          description: "Subscription status before the change."
        plan:
          type: string
          description: "Active plan code after the change."
        previous_plan:
          type: string
          description: "Plan code before the change."
        changed_at:
          type: string
          format: date-time
          description: "Wall-clock time O&M applied the change (UTC)."
        cause:
          type: string
          description: "What triggered the state change (e.g. TrialReactivated)."
      additionalProperties: true

    InboundBillingTenantPlanChangedPayload:
      type: object
      required:
        - tenant_id
        - plan
        - previous_plan
        - effective_at
        - billing_ref
      additionalProperties: true
      description: |
        Mirrors Billing's tenant_plan_changed.json (B-5). Only tenant_id is read;
        the new plan is re-read from Core (I-17).
      properties:
        tenant_id:
          type: string
          format: uuid
        plan:
          type: string
          enum: [starter, pro, enterprise]
        previous_plan:
          type: string
          enum: [starter, pro, enterprise]
        direction:
          type: string
          enum: [upgrade, downgrade]
        effective_at:
          type: string
          format: date-time
        billing_ref:
          type: string
        billing_subscription_id:
          type: string
          format: uuid

    InboundBillingTenantSubscriptionCancelledPayload:
      type: object
      required:
        - tenant_id
        - cancelled_at
        - reason
      additionalProperties: true
      description: Mirrors Billing's tenant_subscription_cancelled.json (B-5).
      properties:
        tenant_id:
          type: string
          format: uuid
        cancelled_at:
          type: string
          format: date-time
        reason:
          type: string
          enum: [dunning_exhausted, customer, auto_renew_off, operator_reversal]

    InboundBillingTenantReactivatedPayload:
      type: object
      required:
        - tenant_id
        - source
        - reactivated_at
      additionalProperties: true
      description: |
        Mirrors Billing's tenant_reactivated.json (B-5). Distinct from
        iam-realm-provisioner's TenantReactivated on tenant-entitlements-q.
      properties:
        tenant_id:
          type: string
          format: uuid
        source:
          type: string
          const: billing
        reactivated_at:
          type: string
          format: date-time
        previous_status:
          type: string
          enum: [past_due, cancelled]
