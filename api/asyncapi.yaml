asyncapi: "3.0.0"

info:
  title: Commercial Entitlements Service — Event Contracts
  version: "1.1.0"
  description: |
    Publishes `tenant_entitlements_changed` whenever a tenant's effective
    entitlement set is recomputed, and `tenant_quota_add_on_changed` whenever
    a quota add-on pack is granted, revoked, or expires. Downstream services
    (quota enforcer, billing, tenant portal) subscribe to react to plan changes,
    overrides, addon balance updates and trial transitions.
  contact:
    name: BCBP Solutions Platform Team
    email: platform@bcbpsolutions.com

servers:
  production:
    host: "sns.ap-south-1.amazonaws.com"
    protocol: "sns"
    description: "AWS SNS entitlements topic"

channels:
  tenantEntitlements:
    address: "arn:aws:sns:{region}:{account}:iam-entitlements-events"
    description: "SNS topic for all entitlement change events."
    bindings:
      sns:
        policy:
          statements: []

operations:
  publishTenantEntitlementsChanged:
    action: send
    channel:
      $ref: "#/channels/tenantEntitlements"
    summary: "Publish when a tenant's effective entitlement set changes."
    description: |
      Emitted after every successful Recompute: plan-based, trial, override,
      and addon-balance changes all produce this event.
    messages:
      - $ref: "#/components/messages/TenantEntitlementsChanged"

  publishTenantQuotaAddOnChanged:
    action: send
    channel:
      $ref: "#/channels/tenantEntitlements"
    summary: "Publish when a quota add-on pack is granted, revoked, or expires."
    description: |
      Emitted exclusively by the Entitlements service (never by Billing — BL-OQ-20)
      whenever an operator grants a quota add-on pack, removes one, or the
      reconciler sweeps an expired pack. Billing uses the purchased_at field as
      the 12-month expiry anchor (BL-OQ-4).
    messages:
      - $ref: "#/components/messages/TenantQuotaAddOnChanged"

components:
  messages:
    TenantEntitlementsChanged:
      name: TenantEntitlementsChanged
      title: Tenant Entitlements Changed
      summary: "A tenant's effective entitlement set has been recomputed."
      contentType: application/json
      payload:
        $ref: "#/components/schemas/TenantEntitlementsChangedPayload"

    TenantQuotaAddOnChanged:
      name: TenantQuotaAddOnChanged
      title: Tenant Quota Add-On Changed
      summary: "A quota add-on pack was granted, revoked, or expired."
      contentType: application/json
      payload:
        $ref: "#/components/schemas/TenantQuotaAddOnChangedPayload"

  schemas:
    TenantEntitlementsChangedPayload:
      type: object
      required:
        - tenant_id
        - version
        - cause
        - computed_at
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "UUID of the tenant whose entitlements were recomputed."
        version:
          type: integer
          minimum: 1
          description: "Monotonically increasing snapshot version number."
        cause:
          type: string
          enum:
            - plan_change
            - override_change
            - addon_change
            - trial_change
            - catalog_refresh
            - billing_event
            - manual_recompute
            - tenant_lifecycle
            - shortfall_resolution
          description: "What triggered this recomputation."
        changed_keys:
          type: array
          items:
            type: string
          description: "Limit keys whose values changed in this version."
        previous_version:
          type: integer
          minimum: 0
          description: "The snapshot version before this recomputation."
        computed_at:
          type: string
          format: date-time
          description: "Wall-clock time the recomputation completed (UTC)."
      additionalProperties: false

    TenantQuotaAddOnChangedPayload:
      type: object
      required:
        - tenant_id
        - addon_id
        - limit_key
        - total_tokens
        - reason
        - action
        - purchased_at
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "The tenant whose quota add-on changed."
        addon_id:
          type: string
          format: uuid
          description: "The quota add-on pack identifier."
        limit_key:
          type: string
          description: "The limit key this add-on extends (e.g. llm_token_quota_monthly)."
        total_tokens:
          type: integer
          minimum: 1
          description: "Total token capacity of the add-on pack."
        reason:
          type: string
          description: "Human-readable reason for the change."
        action:
          type: string
          enum:
            - granted
            - revoked
            - expired
          description: "What happened to the add-on pack."
        purchased_at:
          type: string
          format: date-time
          description: "Wall-clock time the add-on was originally granted. Billing uses this as the 12-month expiry anchor (BL-OQ-4)."
        expires_at:
          type: string
          format: date-time
          description: "When this add-on pack expires; omitted when no expiry is set."
      additionalProperties: false
