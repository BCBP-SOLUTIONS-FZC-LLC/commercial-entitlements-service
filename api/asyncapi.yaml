asyncapi: "3.0.0"

info:
  title: Commercial Entitlements Service — Event Contracts
  version: "1.3.0"
  description: |
    Publishes `tenant_entitlements_changed` whenever a tenant's effective
    entitlement set is recomputed.
    Consumes Billing's `TenantQuotaAddOnChanged` from `billing-entitlements-q`:
    `reason: "purchase"` creates a new quota addon pack (expiry = purchased_at + 12 months,
    idempotent on billing_ref); `reason: "refund"` reduces unused tokens on the referenced
    pack (C-5 / BL-OQ-23, E-1 / BL-OQ-4).
  contact:
    name: BCBP Solutions Platform Team
    email: platform@bcbpsolutions.com

servers:
  production:
    host: "sns.ap-south-1.amazonaws.com"
    protocol: "sns"
    description: "AWS SNS entitlements topic"

channels:
  tenantEntitlements:
    address: "arn:aws:sns:{region}:{account}:iam-entitlements-events"
    description: "SNS topic for all entitlement change events."
    bindings:
      sns:
        policy:
          statements: []

  billingEntitlementsQueue:
    address: "arn:aws:sqs:{region}:{account}:billing-entitlements-q"
    description: "SQS queue receiving Billing events that drive entitlement changes."
    bindings:
      sqs:
        queue:
          name: billing-entitlements-q

operations:
  publishTenantEntitlementsChanged:
    action: send
    channel:
      $ref: "#/channels/tenantEntitlements"
    summary: "Publish when a tenant's effective entitlement set changes."
    description: |
      Emitted after every successful Recompute: plan-based, trial, override,
      and addon-balance changes all produce this event.
    messages:
      - $ref: "#/components/messages/TenantEntitlementsChanged"

  consumeTenantQuotaAddOnChanged:
    action: receive
    channel:
      $ref: "#/channels/billingEntitlementsQueue"
    summary: "Consume Billing's add-on purchase and refund events."
    description: |
      Billing publishes TenantQuotaAddOnChanged on billing.events for every
      confirmed purchase (reason: purchase) and succeeded refund (reason: refund).
      On reason: purchase — creates a new addon pack; delta > 0; expiry =
      purchased_at + 12 months; idempotent on billing_ref (E-1 / BL-OQ-4).
      On reason: refund — reduces unused tokens on the referenced pack (purchase_ref),
      never below zero and never consuming already-drawn tokens; idempotent on
      billing_ref (C-5 / BL-OQ-23).
    messages:
      - $ref: "#/components/messages/InboundTenantQuotaAddOnChanged"

components:
  messages:
    TenantEntitlementsChanged:
      name: TenantEntitlementsChanged
      title: Tenant Entitlements Changed
      summary: "A tenant's effective entitlement set has been recomputed."
      contentType: application/json
      payload:
        $ref: "#/components/schemas/TenantEntitlementsChangedPayload"

    InboundTenantQuotaAddOnChanged:
      name: TenantQuotaAddOnChanged
      title: Tenant Quota Add-On Changed (inbound from Billing)
      summary: "Billing's event for purchase and refund of quota add-on packs."
      contentType: application/json
      payload:
        $ref: "#/components/schemas/InboundTenantQuotaAddOnChangedPayload"

  schemas:
    TenantEntitlementsChangedPayload:
      type: object
      required:
        - tenant_id
        - version
        - cause
        - computed_at
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "UUID of the tenant whose entitlements were recomputed."
        version:
          type: integer
          minimum: 1
          description: "Monotonically increasing snapshot version number."
        cause:
          type: string
          enum:
            - plan_change
            - override_change
            - addon_change
            - trial_change
            - catalog_refresh
            - billing_event
            - manual_recompute
            - tenant_lifecycle
            - shortfall_resolution
          description: "What triggered this recomputation."
        changed_keys:
          type: array
          items:
            type: string
          description: "Limit keys whose values changed in this version."
        previous_version:
          type: integer
          minimum: 0
          description: "The snapshot version before this recomputation."
        computed_at:
          type: string
          format: date-time
          description: "Wall-clock time the recomputation completed (UTC)."
      additionalProperties: false

    InboundTenantQuotaAddOnChangedPayload:
      type: object
      required:
        - tenant_id
        - resource
        - delta
        - reason
        - billing_ref
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "The tenant whose add-on was purchased or refunded."
        resource:
          type: string
          description: "Resource type (e.g. llm_tokens)."
        delta:
          type: integer
          not:
            const: 0
          description: "Token delta: positive for purchase, negative for refund."
        reason:
          type: string
          enum:
            - purchase
            - refund
          description: "Whether this is a purchase or a refund."
        billing_ref:
          type: string
          description: "Billing-side idempotency key (purchase or refund ID)."
        purchase_ref:
          type: string
          format: uuid
          description: "UUID of the original add-on grant; present on refund events only."
        purchased_at:
          type: string
          format: date-time
          description: "Payment-confirmation instant; present on purchase events. Expiry = purchased_at + 12 months (E-1 / BL-OQ-4)."
      additionalProperties: true
