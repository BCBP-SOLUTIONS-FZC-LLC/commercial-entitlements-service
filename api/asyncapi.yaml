asyncapi: "3.0.0"

info:
  title: Commercial Entitlements Service — Event Contracts
  version: "1.2.0"
  description: |
    Publishes `tenant_entitlements_changed` whenever a tenant's effective
    entitlement set is recomputed, and `tenant_add_on_balance_changed` when an
    operator grants, adjusts, revokes, or expires a quota add-on pack.
    Consumes `TenantQuotaAddOnChanged {reason: "refund"}` from Billing to reduce
    unused add-on tokens in response to a successful invoice refund (C-5 / BL-OQ-23).
  contact:
    name: BCBP Solutions Platform Team
    email: platform@bcbpsolutions.com

servers:
  production:
    host: "sns.ap-south-1.amazonaws.com"
    protocol: "sns"
    description: "AWS SNS entitlements topic"

channels:
  tenantEntitlements:
    address: "arn:aws:sns:{region}:{account}:iam-entitlements-events"
    description: "SNS topic for all entitlement change events."
    bindings:
      sns:
        policy:
          statements: []

  billingEntitlementsQueue:
    address: "arn:aws:sqs:{region}:{account}:billing-entitlements-q"
    description: "SQS queue receiving Billing events that drive entitlement changes."
    bindings:
      sqs:
        queue:
          name: billing-entitlements-q

operations:
  publishTenantEntitlementsChanged:
    action: send
    channel:
      $ref: "#/channels/tenantEntitlements"
    summary: "Publish when a tenant's effective entitlement set changes."
    description: |
      Emitted after every successful Recompute: plan-based, trial, override,
      and addon-balance changes all produce this event.
    messages:
      - $ref: "#/components/messages/TenantEntitlementsChanged"

  publishTenantAddOnBalanceChanged:
    action: send
    channel:
      $ref: "#/channels/tenantEntitlements"
    summary: "Publish when an operator grants, adjusts, revokes, or expires an add-on pack."
    description: |
      Emitted exclusively by Entitlements for operator-initiated balance changes
      (goodwill grants, migration credits, manual corrections) and reconciler
      expiry sweeps. AL-5 is the audit path for these events.
      NOT emitted for Billing purchase/refund transactions — those are owned by
      Billing's TenantQuotaAddOnChanged on billing.events (BL-OQ-20).
    messages:
      - $ref: "#/components/messages/TenantAddOnBalanceChanged"

  consumeTenantQuotaAddOnChanged:
    action: receive
    channel:
      $ref: "#/channels/billingEntitlementsQueue"
    summary: "Consume Billing's add-on purchase and refund events."
    description: |
      Billing publishes TenantQuotaAddOnChanged on billing.events for every
      confirmed purchase (reason: purchase) and succeeded refund (reason: refund).
      Entitlements processes reason: refund to reduce unused tokens on the
      referenced add-on pack (purchase_ref), never below zero and never consuming
      already-drawn tokens. Idempotent on billing_ref. (C-5 / BL-OQ-23)
    messages:
      - $ref: "#/components/messages/InboundTenantQuotaAddOnChanged"

components:
  messages:
    TenantEntitlementsChanged:
      name: TenantEntitlementsChanged
      title: Tenant Entitlements Changed
      summary: "A tenant's effective entitlement set has been recomputed."
      contentType: application/json
      payload:
        $ref: "#/components/schemas/TenantEntitlementsChangedPayload"

    TenantAddOnBalanceChanged:
      name: TenantAddOnBalanceChanged
      title: Tenant Add-On Balance Changed
      summary: "An operator granted, adjusted, revoked, or expired a quota add-on pack."
      contentType: application/json
      payload:
        $ref: "#/components/schemas/TenantAddOnBalanceChangedPayload"

    InboundTenantQuotaAddOnChanged:
      name: TenantQuotaAddOnChanged
      title: Tenant Quota Add-On Changed (inbound from Billing)
      summary: "Billing's event for purchase and refund of quota add-on packs."
      contentType: application/json
      payload:
        $ref: "#/components/schemas/InboundTenantQuotaAddOnChangedPayload"

  schemas:
    TenantEntitlementsChangedPayload:
      type: object
      required:
        - tenant_id
        - version
        - cause
        - computed_at
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "UUID of the tenant whose entitlements were recomputed."
        version:
          type: integer
          minimum: 1
          description: "Monotonically increasing snapshot version number."
        cause:
          type: string
          enum:
            - plan_change
            - override_change
            - addon_change
            - trial_change
            - catalog_refresh
            - billing_event
            - manual_recompute
            - tenant_lifecycle
            - shortfall_resolution
          description: "What triggered this recomputation."
        changed_keys:
          type: array
          items:
            type: string
          description: "Limit keys whose values changed in this version."
        previous_version:
          type: integer
          minimum: 0
          description: "The snapshot version before this recomputation."
        computed_at:
          type: string
          format: date-time
          description: "Wall-clock time the recomputation completed (UTC)."
      additionalProperties: false

    TenantAddOnBalanceChangedPayload:
      type: object
      required:
        - tenant_id
        - addon_id
        - limit_key
        - total_tokens
        - reason
        - action
        - granted_at
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "The tenant whose add-on balance changed."
        addon_id:
          type: string
          format: uuid
          description: "The quota add-on pack identifier."
        limit_key:
          type: string
          description: "The limit key this add-on extends (e.g. llm_token_quota_monthly)."
        total_tokens:
          type: integer
          minimum: 1
          description: "Total token capacity of the add-on pack."
        reason:
          type: string
          description: "Human-readable reason (e.g. promotional_grant, operator_correction, migration_credit, contract_entitlement)."
        action:
          type: string
          enum:
            - granted
            - adjusted
            - revoked
            - expired
          description: "What happened to the add-on pack."
        granted_at:
          type: string
          format: date-time
          description: "Wall-clock time the operator originally granted this add-on pack."
        expires_at:
          type: string
          format: date-time
          description: "When this add-on pack expires; omitted when no expiry is set."
      additionalProperties: false

    InboundTenantQuotaAddOnChangedPayload:
      type: object
      required:
        - tenant_id
        - resource
        - delta
        - reason
        - billing_ref
      properties:
        tenant_id:
          type: string
          format: uuid
          description: "The tenant whose add-on was purchased or refunded."
        resource:
          type: string
          description: "Resource type (e.g. llm_tokens)."
        delta:
          type: integer
          not:
            const: 0
          description: "Token delta: positive for purchase, negative for refund."
        reason:
          type: string
          enum:
            - purchase
            - refund
          description: "Whether this is a purchase or a refund."
        billing_ref:
          type: string
          description: "Billing-side idempotency key (purchase or refund ID)."
        purchase_ref:
          type: string
          format: uuid
          description: "UUID of the original add-on grant; present on refund events."
      additionalProperties: false
