{{- if and .Values.callers.istio.enabled .Values.callers.enabled }}
{{- if not .Values.callers.istio.existingCallerNamespaces }}
{{- fail "callers.istio.existingCallerNamespaces is required when the Istio AuthorizationPolicy renders: it is an ALLOW policy, so every caller not listed (gateway, same-namespace services, monitoring) would be denied." }}
{{- end }}
# Istio AuthorizationPolicy for callers of commercial-entitlements.
#
# commercial-entitlements is called BY: Billing (ENT-I1 entitlement read only).
# commercial-entitlements calls OUT TO: IAM Catalog (via egress) — that is NOT
# an ingress rule here and must NOT appear in this policy.
#
# ALLOW-policy safety: an Istio ALLOW policy denies every request that matches
# no rule. The first rule covers all namespaces already admitted by the base
# NetworkPolicy ingress rules (gateway, same-namespace commercial services,
# monitoring). Without it, those callers would be silently denied when this
# policy becomes active.
#
# Prerequisites:
#   - Istio installed in the cluster
#   - PeerAuthentication STRICT mode active in the commercial namespace
#   - commercial-billing ServiceAccount exists in billing namespace with
#     Istio sidecar injection enabled
#
# Billing (B-2, F-2): the commercial-billing principal may only call
#   GET /api/v1/internal/tenants/{id}/entitlements   (ENT-I1)
# Istio `paths` match exact, prefix ("/x*") or suffix ("*/x") only — a
# mid-path "*" is matched literally — so this layer admits GET on the
# internal tenant prefix, and the app's billingReadOnly
# (internal/adapter/inbound/http/middleware.go) narrows it to ENT-I1: GET
# ENT-I2 (/plans/current) answers 403 there, and every non-GET internal
# route and every non-internal route is denied here. A suffix rule
# ("*/entitlements") is NOT used: it would also admit ENT-T1, which
# billingReadOnly does not guard.
# Do NOT add the billing namespace to existingCallerNamespaces: that rule
# admits every route and would defeat W-10.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "commercial-entitlements.fullname" . }}-callers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commercial-entitlements.labels" . | nindent 4 }}
  annotations:
    app.kubernetes.io/component: "caller-policy"
spec:
  selector:
    matchLabels:
      {{- include "commercial-entitlements.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    # Existing callers — namespace-level allow for every caller currently
    # admitted by the base NetworkPolicy ingress rules (gateway, all
    # same-namespace commercial services, monitoring).
    - from:
        - source:
            namespaces:
              {{- toYaml .Values.callers.istio.existingCallerNamespaces | nindent 14 }}
    {{- if .Values.billingCaller.enabled }}
    # Billing service (commercial-billing SA) — ENT-I1 read only.
    - from:
        - source:
            principals:
              - "{{ .Values.callers.istio.trustDomain }}/ns/{{ .Values.billingCaller.namespace }}/sa/{{ .Values.billingCaller.serviceAccountName }}"
      to:
        - operation:
            methods: ["GET"]
            paths:
              - "/api/v1/internal/tenants/*"
    {{- end }}
{{- end }}
