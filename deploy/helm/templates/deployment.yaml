apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "commercial-entitlements.fullname" . }}
  labels:
    {{- include "commercial-entitlements.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "commercial-entitlements.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "commercial-entitlements.selectorLabels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "commercial-entitlements.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          envFrom:
            - configMapRef:
                name: {{ include "commercial-entitlements.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secretRef }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "commercial-entitlements.fullname" . }}-config
  labels:
    {{- include "commercial-entitlements.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}

{{- define "commercial-entitlements.fullname" -}}
{{ .Release.Name }}-commercial-entitlements
{{- end }}

{{- define "commercial-entitlements.labels" -}}
app.kubernetes.io/name: commercial-entitlements
app.kubernetes.io/instance: {{ .Release.Name }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}

{{- define "commercial-entitlements.selectorLabels" -}}
app.kubernetes.io/name: commercial-entitlements
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- define "commercial-entitlements.serviceAccountName" -}}
{{- if .Values.serviceAccount.create -}}
{{ default (include "commercial-entitlements.fullname" .) .Values.serviceAccount.name }}
{{- else -}}
{{ default "default" .Values.serviceAccount.name }}
{{- end -}}
{{- end }}
