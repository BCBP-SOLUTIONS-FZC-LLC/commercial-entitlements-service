{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "commercial-entitlements.fullname" . }}
  labels:
    {{- include "commercial-entitlements.labels" . | nindent 4 }}
  {{- if .Values.autoscaling.targetRPSPerReplica }}
  annotations:
    observability.platform/metric-status: proposed
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "commercial-entitlements.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetRPSPerReplica }}
    # RPS-based scaling. PREREQUISITE: prometheus-adapter must be installed and
    # configured with deploy/monitoring/prometheus-adapter-rule.yaml.
    - type: Pods
      pods:
        metric:
          name: platform_http_requests_per_second
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetRPSPerReplica }}
    {{- end }}
{{- end }}
