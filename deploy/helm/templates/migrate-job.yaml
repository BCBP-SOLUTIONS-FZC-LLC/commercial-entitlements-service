{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "commercial-entitlements.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "commercial-entitlements.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    spec:
      serviceAccountName: {{ include "commercial-entitlements.serviceAccountName" . }}
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/migrate"]
          envFrom:
            - configMapRef:
                name: {{ include "commercial-entitlements.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secretRef }}
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
{{- end }}
