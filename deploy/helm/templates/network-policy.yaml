{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commercial-entitlements.fullname" . }}
  labels:
    {{- include "commercial-entitlements.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commercial-entitlements.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow API traffic from the ingress controller / gateway namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
          {{- with .Values.networkPolicy.ingressControllerPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP

    # Allow internal service-to-service traffic within the same namespace.
    # Required for same-namespace services (catalog-refresh, expiry) and
    # any future intra-commercial callers.
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP

    # Allow Prometheus to scrape :9090/metrics — restricted to the
    # monitoring namespace only. Metrics live on a SEPARATE port from the
    # API, so this rule grants no API access.
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.metricsPort }}
          protocol: TCP
    {{- end }}

    # Billing Service (billingCaller) — calls entitlement/quota routes.
    # commercial-entitlements does NOT call IAM-org-membership inbound;
    # it calls IAM Catalog outbound (see egress below).
    {{- if .Values.billingCaller.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.billingCaller.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.billingCaller.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}

    {{- with .Values.networkPolicy.additionalIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  egress:
    # Allow DNS resolution.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Allow HTTPS to AWS regional endpoints (SNS, SQS, Glue, CloudWatch, STS).
    - ports:
        - port: 443
          protocol: TCP

    # Allow PostgreSQL / PgBouncer connections.
    - ports:
        - port: 5432
          protocol: TCP
        - port: 5433
          protocol: TCP

    # Allow Valkey (Redis-protocol) connections (advisory cache: effective
    # set, quota ceilings, usage counters, plan definitions).
    - ports:
        - port: 6379
          protocol: TCP

    # Allow OTel OTLP gRPC to the collector (platform-gincommon tracing).
    - ports:
        - port: 4317
          protocol: TCP

    # Allow HTTP outbound to IAM Catalog service (IAM_CATALOG_BASE_URL)
    # and any other internal HTTP dependencies.
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP

    # Allow Temporal gRPC (TEMPORAL_HOST_PORT — optional, skipped when unset).
    - ports:
        - port: 7233
          protocol: TCP

    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
