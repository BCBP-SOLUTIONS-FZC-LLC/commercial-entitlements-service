{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commercial-entitlements.fullname" . }}-allow-billing
  labels:
    {{- include "commercial-entitlements.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commercial-entitlements.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: billing
          podSelector:
            matchLabels:
              app.kubernetes.io/name: commercial-billing
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
{{- end }}
