{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "commercial-entitlements.fullname" . }}-secrets
  labels:
    {{- include "commercial-entitlements.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $val := .Values.secretValues }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}
