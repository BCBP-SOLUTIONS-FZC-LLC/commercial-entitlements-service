apiVersion: v1
kind: Service
metadata:
  name: {{ include "commercial-entitlements.fullname" . }}
  labels:
    {{- include "commercial-entitlements.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      name: metrics
  selector:
    {{- include "commercial-entitlements.selectorLabels" . | nindent 4 }}
