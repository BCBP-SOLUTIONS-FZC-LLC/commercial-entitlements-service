# Prometheus alerting rules for the commercial-entitlements schema registry.
# Covers Glue schema registration failures surfaced via schema-registry.yml CI metrics.

groups:
  - name: commercial_entitlements_schema_registry
    rules:
      - alert: CommercialEntitlementsSchemaRegistrationStalledStaging
        expr: |
          time() - commercial_entitlements_schema_last_registered_timestamp_seconds{environment="staging"} > 86400
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Schema registration in staging has not run in > 24h"
          description: >-
            The last successful schema registration to commercial-entitlements-events (staging)
            was more than 24 hours ago. Check the schema-registry GitHub Actions workflow.

      - alert: CommercialEntitlementsSchemaRegistrationStalledProduction
        expr: |
          time() - commercial_entitlements_schema_last_registered_timestamp_seconds{environment="production"} > 172800
        for: 30m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Schema registration in production has not run in > 48h"
          description: >-
            The last successful schema registration to commercial-entitlements-events (production)
            was more than 48 hours ago. Schema drift between the service and Glue is possible.
