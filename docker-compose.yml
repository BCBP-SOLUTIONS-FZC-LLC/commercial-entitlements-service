services:
  app:
    build:
      context: .
      secrets:
        - go_private_token
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      APP_ENV: dev
      APP_PORT: "8080"
      METRICS_PORT: "9090"
      APP_NAME: commercial-entitlements
      PG_HOST: pgbouncer
      PG_PORT: "5432"
      PG_USER: commercial_entitlements_app
      PG_PASSWORD: devpassword
      PG_DBNAME: commercial_entitlements
      PG_SSLMODE: disable
      PG_MAX_CONNS: "20"
      PG_MIN_CONNS: "0"
      PG_BOUNCER_MODE: "true"
      # Migrations and the BYPASSRLS sysPool both use the migrator role,
      # directly against Postgres — PgBouncer's userlist knows only the app role.
      MIGRATION_DATABASE_URL: postgres://commercial_entitlements_migrator:devpassword@postgres:5432/commercial_entitlements?sslmode=disable
      SYSTEM_DATABASE_URL: postgres://commercial_entitlements_migrator:devpassword@postgres:5432/commercial_entitlements?sslmode=disable
      VALKEY_URL: redis:6379
      SNS_TOPIC_ENTITLEMENTS_ARN: arn:aws:sns:ap-south-1:000000000000:commercial-entitlements-events
      SQS_BILLING_ENTITLEMENTS_QUEUE_URL: http://floci:4566/000000000000/billing-entitlements-q
      SQS_TENANT_ENTITLEMENTS_QUEUE_URL: http://floci:4566/000000000000/tenant-entitlements-q
      SQS_CATALOG_ENTITLEMENTS_QUEUE_URL: http://floci:4566/000000000000/catalog-entitlements-q
      SQS_MEMBERSHIP_ENTITLEMENTS_QUEUE_URL: http://floci:4566/000000000000/membership-entitlements-q
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://floci:4566
      # Glue Schema Registry — Floci provisions the registry + TenantEntitlementsChanged
      # schema via scripts/init-floci.sh, so the real GlueCodec wire format runs locally.
      GLUE_REGISTRY_ENTITLEMENTS_NAME: commercial-entitlements-events
      GLUE_REGISTRY_ENTITLEMENTS_ARN: arn:aws:glue:ap-south-1:000000000000:registry/commercial-entitlements-events
      OUTBOX_POLL_INTERVAL: 500ms
      OUTBOX_CONCURRENCY: "4"
      OUTBOX_CLAIM_LEASE: 10m
      OUTBOX_RETENTION_DAYS: "8"
      IAM_CATALOG_BASE_URL: http://host.docker.internal:8081
      TEMPORAL_HOST_PORT: temporal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      # Superuser only for init; scripts/init-db.sql creates the RLS-bound app
      # role and the BYPASSRLS migrator. A superuser bypasses RLS.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: commercial_entitlements
    ports:
      # Host 5435 → container 5432. Offset so this service runs alongside IAM
      # services (5533/5534) on the same host without port conflicts.
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commercial_entitlements"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      # Host 5434 → container 5432.
      - "5434:5432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: commercial_entitlements_app
      DB_PASSWORD: devpassword
      DB_NAME: commercial_entitlements
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,lock_timeout,statement_timeout
      SERVER_TLS_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U commercial_entitlements_app || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    ports:
      # Host 6382 → container 6379.
      - "6382:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  floci:
    # Floci — open-source (MIT), always-free AWS emulator. Unlike LocalStack
    # Community, Glue Schema Registry ships in the free tier, so this single
    # service covers SNS + SQS + Glue without a Pro licence.
    # scripts/init-floci.sh provisions the registry + TenantEntitlementsChanged
    # schema alongside the SNS/SQS topology on container start.
    image: floci/floci:2.1.0-compat
    ports:
      # Host 4569 → container 4566.
      - "4569:4566"
    environment:
      FLOCI_DEFAULT_REGION: ap-south-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      # Rewrites the host in SQS QueueUrl / SNS TopicArn responses so that
      # floci-ui (which resolves those URLs directly from inside its own
      # container) can actually reach them. Without this, queue/topic lists
      # load fine but per-queue attribute calls (message counts etc.) silently
      # return empty.
      FLOCI_HOSTNAME: floci
      # init-floci.sh makes many sequential aws CLI round-trips (5 topics,
      # 12 queues+DLQs, 6 subscriptions, 1 registry, 1 schema); give real
      # headroom on a busy host to avoid tripping the ready-hook timeout.
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: "90"
    volumes:
      - floci_data:/app/data
      - ./scripts/init-floci.sh:/etc/floci/init/ready.d/init-floci.sh
      - ./internal/adapter/outbound/eventbus/schemas:/etc/floci/init/schemas:ro
    healthcheck:
      # Checks for TenantEntitlementsChanged — the LAST resource that
      # init-floci.sh registers — not just SNS reachability. SNS topics exist
      # ~5s into the script while Glue registration is still running, so a
      # shallow `sqs list-queues` check would report "healthy" before
      # GLUE_REGISTRY_ENTITLEMENTS_NAME's schemas actually exist, crashing
      # GlueCodec's startup prefetch.
      test: ["CMD", "aws", "--region", "ap-south-1", "glue", "get-schema",
             "--schema-id", "RegistryName=commercial-entitlements-events,SchemaName=TenantEntitlementsChanged"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  floci-ui:
    # Web console for floci — browse SNS/SQS/Glue resources at
    # http://localhost:4502 instead of the aws CLI. Talks to `floci` over
    # the compose network. Shows live message counts — good for visually
    # confirming an event landed in the right queue — but does not (yet)
    # show message bodies; use the CLI cookbook in test.md for that.
    image: floci/floci-ui:0.5.0
    ports:
      # Host 4502 → container 4500. 4500 is claimed by iam-org-membership's
      # floci-ui so both services can run side-by-side on the same host.
      - "4502:4500"
    environment:
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # NOT the same as AWS_ENDPOINT_URL. The AWS SDK clients that list/describe
      # resources pick AWS_ENDPOINT_URL up automatically, but floci-ui's own
      # connectivity probe and "Connected"/"Not connected" banner read this
      # separate floci-ui-specific var. Leaving it unset makes the console probe
      # localhost:4566 from inside its own container — itself, not `floci` —
      # so it always shows "Not connected" regardless of whether resource listing
      # actually works.
      FLOCI_ENDPOINT: http://floci:4566
      AWS_ENDPOINT_URL: http://floci:4566
      PORT: "4500"
    depends_on:
      floci:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.26
    ports:
      - "7234:7233"
      - "8234:8233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=devpassword
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  go_private_token:
    environment: "GO_PRIVATE_TOKEN"

volumes:
  postgres_data:
  floci_data:
